<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="meta-title">AbdulQadir | Project Archive</title>
  <meta name="description" content="Selected web development, design, and digital product work by AbdulQadir Memon.">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link href="./style.css" rel="stylesheet">
</head>

<body class="selection:bg-[#6cff52] selection:text-black">
  <div class="bg-animation"></div>

  <nav class="site-nav glass" aria-label="Primary navigation">
    <div class="site-nav__inner px-5 md:px-7 flex justify-between items-center">
      <a href="index.html" class="brand-mark text-lg font-extrabold gradient-text">AbdulQadir</a>
      <div class="flex items-center gap-4 md:gap-8">
        <a href="projects.html" class="nav-link hidden sm:block text-[10px] font-bold uppercase tracking-[0.25em]" aria-current="page">Projects</a>
        <a href="index.html#contact" class="nav-cta px-5 py-2.5 bg-[#b8ff63] text-black rounded-full text-xs font-bold">Start a project</a>
      </div>
    </div>
  </nav>

  <main class="pt-40 pb-24 px-6">
    <div class="max-w-7xl mx-auto">
      <div class="max-w-3xl mb-16 md:mb-20">
        <p class="hero-kicker text-[10px] font-bold uppercase tracking-[0.35em] text-zinc-400 mb-6">Project archive</p>
        <h1 class="text-5xl md:text-7xl font-extrabold text-white tracking-[-0.06em] leading-[.95] mb-6">Work built to move <span class="gradient-text">business forward.</span></h1>
        <p class="text-zinc-400 text-lg leading-relaxed max-w-2xl">A collection of digital products, commerce experiences, and thoughtful interfaces created for real-world outcomes.</p>
      </div>
      
      <div id="all-projects-grid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">
        <div class="animate-pulse glass h-80 rounded-[2.5rem]"></div>
        <div class="animate-pulse glass h-80 rounded-[2.5rem]"></div>
        <div class="animate-pulse glass h-80 rounded-[2.5rem]"></div>
      </div>
    </div>
  </main>

  <section id="contact" class="section-divider py-24 px-6">
    <div class="max-w-3xl mx-auto glass p-12 md:p-16 rounded-[3rem] border border-white/5">
      <h2 class="text-4xl font-bold mb-8 text-center tracking-tighter">Let's <span class="gradient-text">Connect</span></h2>
      <form action="contact.php" method="POST" class="contact-form space-y-6">
        <div class="contact-honeypot" aria-hidden="true"><label>Website<input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
        <input type="text" name="name" aria-label="Your name" placeholder="Name" maxlength="100" required class="modern-input">
        <input type="email" name="email" aria-label="Your email" placeholder="Email" maxlength="254" required class="modern-input">
        <textarea name="message" aria-label="Your message" placeholder="Message" rows="4" maxlength="5000" required class="modern-input"></textarea>
        <button type="submit" class="w-full py-5 bg-[#b8ff63] text-black font-black uppercase tracking-widest rounded-xl hover:brightness-110 transition">Send Message</button>
        <p class="contact-status" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>

  <footer class="py-16 px-6 glass border-t border-white/10">
    <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-8">
      <h4 class="text-xl font-extrabold italic tracking-tighter">AbdulQadir<span class="text-[#6cff52]">.</span></h4>
      <p class="text-[9px] uppercase tracking-[0.3em] text-zinc-700 font-bold">&copy; 2026 METRISOLUTION PVT LTD</p>
    </div>
  </footer>

  <script src="./contact.js" defer></script>

  <script type="module">
    import { getData } from './firebase-config.js';
    async function initProjects() {
      const grid = document.getElementById('all-projects-grid');
      try {
        const projects = await getData('projects');
        grid.innerHTML = projects.map(p => `
          <article class="group glass rounded-[2rem] p-3 hover:-translate-y-1 transition duration-300">
            <div class="relative aspect-[16/10] overflow-hidden rounded-[1.5rem] border border-white/5 bg-zinc-900 mb-5">
              <img src="${p.img}" alt="${p.title}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition duration-700">
              <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                 <a href="${p.link}" target="_blank" rel="noopener" class="px-8 py-3 bg-[#b8ff63] text-black font-bold rounded-full text-[10px] uppercase tracking-widest">Live Preview</a>
              </div>
            </div>
            <div class="px-3 pb-3">
              <p class="text-[9px] font-bold uppercase tracking-[.25em] text-[#b8ff63] mb-2">${p.category || 'Selected work'}</p>
              <h4 class="text-xl font-bold text-white mb-2">${p.title}</h4>
              <p class="text-zinc-500 text-sm">${p.desc || ''}</p>
            </div>
          </article>
        `).join('');
      } catch (e) { grid.innerHTML = "<p class='text-red-500'>Error loading data.</p>"; }
    }
    document.addEventListener('DOMContentLoaded', initProjects);
  </script>
</body>
</html>
