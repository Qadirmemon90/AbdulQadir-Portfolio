<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login | AbdulQadir</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0a0a0a; }
        .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-6">
    <div class="glass p-10 rounded-[2.5rem] w-full max-w-md text-center">
        <h1 class="text-3xl font-extrabold mb-2 text-white">Welcome Back</h1>
        <p class="text-zinc-500 mb-8 text-sm">Secure access for AbdulQadir Memon</p>
        
        <form id="login-form" class="space-y-4">
            <input type="email" id="email" placeholder="Email" class="w-full p-4 bg-black rounded-2xl border border-white/5 outline-none text-white focus:border-[#6cff52]/50 transition" required>
            <input type="password" id="pass" placeholder="Password" class="w-full p-4 bg-black rounded-2xl border border-white/5 outline-none text-white focus:border-[#6cff52]/50 transition" required>
            <button type="submit" class="w-full py-4 bg-white text-black font-bold rounded-2xl hover:bg-[#6cff52] transition transform active:scale-95">Login to Dashboard</button>
        </form>
    </div>

    <script type="module">
        import { auth } from './firebase-config.js';
        import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        document.getElementById('login-form').onsubmit = async (e) => {
            e.preventDefault();
            try {
                await signInWithEmailAndPassword(auth, email.value, pass.value);
                window.location.href = 'admin.html';
            } catch (err) { alert("Access Denied: " + err.message); }
        };
    </script>
</body>
</html>
